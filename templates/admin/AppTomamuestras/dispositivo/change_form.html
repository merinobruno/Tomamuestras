{% extends "admin/change_form.html" %}
{% load static %}

{% block extrastyle %}
<style>
    .card {
        background: white;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .card h2 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 20px;
    }

    .form-row {
        margin-bottom: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    input, select {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #ccc;
        background: #fafafa;
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <h2>Datos del Dispositivo</h2>
    {{ block.super }}
</div>
{% endblock %}
